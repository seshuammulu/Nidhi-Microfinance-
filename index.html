function calc(db,P){

const paidOn=(l,d)=>l.payments.filter(p=>p.date===d).reduce((a,p)=>a+p.amt,0);
const expTo=(l,d)=>l.schedule.filter(s=>s.date<=d).reduce((a,s)=>a+s.amt,0);
const outstanding=l=>Math.max(0,l.total-paidTotal(l));
function overdueCount(l,date){const paid=paidBefore(l,date);let cum=0,n=0;l.schedule.forEach(s=>{cum+=s.amt;if(s.date<date&&cum>paid)n++});return n}
const lateSuggest=(l,date)=>overdueCount(l,date)*db.settings.lateFee;

function dueRows(d,branch){
  const rows=[];
  visLoans().forEach(l=>{
    const m=mem(l.memberId);if(!m)return;const g=grp(m.groupId);if(!g)return;
    if(branch!=='all'&&g.branchId!==branch)return;
    if(l.disbDate>=d)return;
    const exp=expTo(l,d),before=Math.max(0,exp-paidBefore(l,d)),got=paidOn(l,d),left=Math.max(0,exp-paidTo(l,d));
    const sch=l.schedule.find(s=>s.date===d);
    if(before<=0&&got<=0&&!sch)return;
    if(before<=0&&got<=0&&sch&&left<=0)return;
    const inst=sch?sch.amt:0;
    rows.push({l,m,g,toCollect:before,got,left,inst,arrears:Math.max(0,before-inst)});
  });
  return rows;
}

function monthStats(sid,ym){

  for(let i=1;i<=n;i++){const d=ym+'-'+pad(i,2);if(d>t||d<s.joinDate)continue;const st=dayStatus(sid,d);if(st)c[st]++;else c.Unmarked++}

function genPayroll(ym){
  const n=dim(ym),first=ym+'-01',last=ym+'-'+pad(n,2);let made=0;
  db.staff.forEach(s=>{
    if(s.joinDate>last)return;if(s.exit&&s.exit.status==='accepted'&&s.exit.lastDay<first)return;
    let p=db.payroll.find(x=>x.staffId===s.id&&x.month===ym);if(p&&p.status==='paid')return;
    const st=monthStats(s.id,ym);let unpaid=st.Absent+0.5*st['Half day']+st['Unpaid leave'];
    if(s.joinDate>first)unpaid+=+s.joinDate.slice(8)-1;
    if(s.exit&&s.exit.status==='accepted'&&s.exit.lastDay<last)unpaid+=n-(+s.exit.lastDay.slice(8));
    const allow=s.hra+s.travel+s.phone+s.other;const earned=Math.round((s.basic+allow)*Math.max(0,n-unpaid)/n);
    const rec={staffId:s.id,month:ym,basic:s.basic,hra:s.hra,travel:s.travel,phone:s.phone,other:s.other,dim:n,unpaid,earned,unmarked:st.Unmarked};
    if(p){Object.assign(p,rec);p.net=p.earned+p.bonus-p.ded}
    else{db.payroll.push(Object.assign({id:uid('pay'),bonus:0,ded:0,bonusNote:'',dedNote:'',net:earned,status:'draft',paidOn:''},rec))}
    made++;
  });
  return made;
}

function updColl(reset){
  const M=ui.modal;if(!M||M.t!=='collect')return;
  const l=db.loans.find(x=>x.id===M.loan);const dEl=document.getElementById('cDate');if(!dEl||!dEl.value)return;const d=dEl.value;
  const exp=expTo(l,d),before=Math.max(0,exp-paidBefore(l,d)),got=paidOn(l,d),left=Math.max(0,exp-paidTo(l,d));
  const n=overdueCount(l,d),ls=n*db.settings.lateFee;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set('cDue',inr(before));set('cLeft',inr(left));
  document.getElementById('cNote').innerHTML=got>0?'<div class="note small">Already collected '+inr(got)+' on '+fd(d)+'.</div>':'';
  document.getElementById('cLateHint').textContent=n?'Suggested late fee: '+inr(db.settings.lateFee)+' × '+n+' overdue installment'+(n>1?'s':'')+' = '+inr(ls):'No overdue installments on this date, so no late fee is suggested.';
  const a=document.getElementById('cAmt'),lt=document.getElementById('cLate');
  if(reset||!a.dataset.t)a.value=left;
  if(reset||!lt.dataset.t)lt.value=ls;
  set('cTotal',inr((+a.value||0)+(+lt.value||0)));
}

function resizePhoto(file){
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    const S=240,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
    const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
    const url=c.toDataURL('image/jpeg',0.78);
    const v=document.getElementById('photoVal'),w=document.getElementById('phWrap');
    if(v)v.value=url;if(w)w.innerHTML='<img alt="" src="'+url+'">';
  };img.onerror=()=>toast('Could not read that image');img.src=rd.result};
  rd.readAsDataURL(file);
}

document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f).entries());const k=f.dataset.form;ui.err='';
  if(k==='signin'){
    const u=db.users.find(x=>x.mobile.toLowerCase()===d.mobile.trim().toLowerCase());
    if(!u||u.pw!==hash(d.pw)){ui.err='Mobile number or password is wrong.';return render()}
    if(!u.active){ui.err='This account is deactivated. Ask your admin.';return render()}
    u.lastLogin=new Date().toISOString();db.session=u.id;save();if(!me()){db.session=null;ui.err='This staff account has ended.';return render()}ui.tab='home';log('Signed in','');return render();
  }
  if(k==='signup'){
    if(db.users.some(x=>x.mobile===d.mobile)){ui.err='This mobile number is already registered.';return render()}
    const u={id:uid('u'),name:d.name.trim(),mobile:d.mobile,pw:hash(d.pw),role:'officer',branchId:d.branch,active:true,lastLogin:new Date().toISOString()};
    db.users.push(u);db.session=u.id;log('Account created',u.name+' '+u.mobile);ui.tab='home';return render();
  }
  if(k==='fp1'){
    const u=db.users.find(x=>x.mobile===d.mobile.trim());
    if(!u){ui.err='No account found for this mobile number.';return render()}
    ui.fp={mobile:u.mobile,uid:u.id,otp:String(Math.floor(100000+Math.random()*900000))};return render();
  }
  if(k==='fp2'){
    if(d.otp!==ui.fp.otp){ui.err='OTP does not match.';return render()}
    const u=db.users.find(x=>x.id===ui.fp.uid);u.pw=hash(d.pw);save();ui.fp=null;ui.auth='in';
    db.audit.unshift({ts:new Date().toISOString(),user:u.name,action:'Password reset',detail:u.mobile});save();
    ui.err='';render();return toast('Password changed. Sign in now.');

    if(f.dataset.id){

      if(isAdmin()||m.status==='pending'){Object.assign(m,clean);log('Member updated',fullName(m)+' '+m.code);return done('Member updated',{t:'member',id:m.id})}
      const ch={},old={};MFIELDS.forEach(x=>{if(x==='native'&&m.native==='Same as above'&&clean.native===composeAddr(clean))return;if(String(clean[x])!==String(m[x]==null?'':m[x])){ch[x]=clean[x];old[x]=m[x]}});
      if(!Object.keys(ch).length)return toast('No changes to send');
      db.requests.push({id:uid('r'),type:'member_edit',memberId:m.id,changes:ch,old,by:me().name,ts:new Date().toISOString(),status:'pending'});
      log('Member edit requested',fullName(m)+' · '+Object.keys(ch).map(x=>MLABEL[x]).join(', '));return done('Sent to admin for approval',{t:'member',id:m.id});
    }
    if(!clean.photo)return toast('Add the member’s photo');
    const g=grp(clean.groupId);const b=br(g.branchId);db.seq.m++;
    const m=Object.assign({id:uid('m'),code:'NMF-'+b.code+'-'+pad(db.seq.m,5),createdAt:today(),status:isAdmin()?'approved':'pending',addedBy:me().name},clean);db.members.push(m);
    const n=db.members.filter(x=>x.groupId===g.id).length;
    log('Member added',fullName(m)+' '+m.code+(isAdmin()?'':' (pending approval)'));
    return done(isAdmin()?(n>5?'Added. Note: this group now has '+n+' members':'Member '+m.code+' added'):'Submitted. Waiting for admin approval',{t:'member',id:m.id});
  }
  if(k==='loan'){
    const P=+d.amount;if(!(P>=1000))return toast('Enter an amount of at least ₹1,000');
    const m=mem(d.memberId);if(m.status!=='approved')return toast('Member is not approved yet');
    const l=makeLoan(db,d.memberId,P,d.date,me().name,+d.repayDay);db.loans.push(l);m.repayDay=+d.repayDay;
    log('Loan disbursed',l.no+' '+fullName(m)+' '+inr(P)+' on '+d.date+' · '+DAYN[l.repayDay]);return done('Loan '+l.no+' created. Schedule fixed.',{t:'loan',id:l.id});
  }
  if(k==='collect'){

    if(f.dataset.id){const b=br(f.dataset.id);b.name=d.name.trim();b.code=d.code.trim().toUpperCase();log('Branch updated',b.name)}
    else{db.branches.push({id:uid('b'),name:d.name.trim(),code:d.code.trim().toUpperCase()});log('Branch added',d.name)}

  }
  if(k==='user'){
    const u=db.users.find(x=>x.id===f.dataset.id);
    if(u.id===db.session&&(d.active==='0'||d.role!=='admin')&&db.users.filter(x=>x.role==='admin'&&x.active).length<2)return toast('Keep at least one active admin');
    Object.assign(u,{name:d.name.trim(),role:d.role,branchId:d.branchId||null,active:d.active==='1'});if(d.pw)u.pw=hash(d.pw);
    log('Login updated',u.name+' · '+u.role);return done('Saved');
  }
  if(k==='settings'){
    const old=db.settings;db.settings={rate:+d.rate,weeks:Math.round(+d.weeks),fee:+d.fee,ins:+d.ins,lateFee:Math.round(+d.lateFee)};
    log('Loan terms changed','interest '+old.rate+'→'+d.rate+'%, fee '+old.fee+'→'+d.fee+'%, insurance '+old.ins+'→'+d.ins+'%, weeks '+old.weeks+'→'+d.weeks+', late fee '+old.lateFee+'→'+d.lateFee);return done('Terms saved');
  }
  if(k==='staff'){
    if(d.aadhaar&&!/^\d{12}$/.test(d.aadhaar))return toast('Aadhaar must be 12 digits');
    const clean={};STF_F.forEach(x=>{clean[x]=d[x]==null?'':String(d[x]).trim()});
    ['age','probation','basic','hra','travel','phone','other'].forEach(x=>{clean[x]=+clean[x]||0});clean.photo=d.photo||'';if(d.nativeSame)clean.native=composeAddr(d);
    let s;
    if(f.dataset.id){s=stf(f.dataset.id);Object.assign(s,clean)}
    else{db.seq.s++;s=Object.assign({id:uid('s'),code:'NMF-EMP-'+pad(db.seq.s,3),aptNo:'NMF/HR/APT/'+pad(db.seq.s,5),userId:null,exit:null},clean);db.staff.push(s)}
    if(d.login==='__new'){
      if(!d.pw||d.pw.length<6)return toast('Set a password of at least 6 characters for the new login');
      if(db.users.some(u=>u.mobile===s.mobile))return toast('A login already uses this mobile number');
      const u={id:uid('u'),name:s.name+' '+s.surname,mobile:s.mobile,pw:hash(d.pw),role:d.role,branchId:d.role==='admin'?null:s.branchId,active:true};db.users.push(u);s.userId=u.id;
    }else if(d.login){s.userId=d.login}else{s.userId=null}
    log(f.dataset.id?'Staff updated':'Staff added',s.name+' '+s.surname+' '+s.code);return done('Staff saved',{t:'staff',id:s.id});
  }
  if(k==='leave'){
    const s=isAdmin()?stf(d.staffId):myStaff();if(!s)return toast('No staff profile found');
    if(d.to<d.from)return toast('End date is before the start date');
    const days=leaveDays(d.from,d.to);
    if(!isAdmin()&&QUOTA[d.type]!=null&&days>QUOTA[d.type]-leaveUsed(s.id,d.type))return toast('Not enough '+d.type+' leave left. Choose Unpaid or fewer days.');
    db.leaves.push({id:uid('lv'),staffId:s.id,type:d.type,from:d.from,to:d.to,days,reason:d.reason.trim(),status:isAdmin()?'approved':'pending',by:me().name,ts:new Date().toISOString()});
    log(isAdmin()?'Leave added':'Leave requested',s.name+' · '+d.type+' · '+days+' day(s)');return done(isAdmin()?'Leave added':'Leave sent for approval');
  }
  if(k==='payslip'){
    const p=db.payroll.find(x=>x.id===f.dataset.id);p.bonus=+d.bonus||0;p.ded=+d.ded||0;p.bonusNote=d.bonusNote||'';p.dedNote=d.dedNote||'';delete p.note;p.net=p.earned+p.bonus-p.ded;
    log('Payslip edited',(stf(p.staffId)||{}).name+' '+fm(p.month)+' net '+inr(p.net));return done('Payslip saved',{t:'payslip',id:p.id});
  }
  if(k==='exit'){
    const s=isAdmin()?stf(d.staffId):myStaff();if(!s)return toast('Choose a staff member');
    if(d.lastDay<d.date)return toast('Last day is before the notice date');
    s.exit={type:isAdmin()?d.type:'Resignation',date:d.date,lastDay:d.lastDay,reason:d.reason.trim(),status:isAdmin()?'accepted':'pending',by:me().name};
    log(isAdmin()?'Exit recorded':'Resignation submitted',s.name+' · last day '+d.lastDay);return done(isAdmin()?'Exit recorded':'Resignation sent to admin');
  }
});
render();
})();
</script>
